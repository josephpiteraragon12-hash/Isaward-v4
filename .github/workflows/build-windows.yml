name: Compilar IsaWard.exe

on:
  workflow_dispatch:          # botón "Run workflow" en la pestaña Actions
  push:
    tags: ["v*"]              # al subir una etiqueta como v0.1.0 también publica un Release

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt pyinstaller
      - name: Probar conversión de documentos
        run: python -m unittest discover tests
      - name: Compilar
        run: pyinstaller --noconfirm --clean --windowed --onedir --name IsaWard --icon assets/isaward.ico --collect-data docx --exclude-module tkinter run_isaward.py
      - name: Comprimir
        run: Compress-Archive -Path dist/IsaWard -DestinationPath IsaWard-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: IsaWard-windows
          path: IsaWard-windows.zip
      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: IsaWard-windows.zip
